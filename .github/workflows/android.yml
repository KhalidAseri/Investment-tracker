name: Build Android APK

# Produces an installable APK without needing a local Android toolchain.
# Run it from the Actions tab ("Run workflow"), then download the APK from the
# run's Artifacts section.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Guard the release: a broken calculation must not reach a phone.
      - name: Run pricing engine tests
        run: npm test

      - name: Build web assets and sync to Android
        run: npm run android:sync

      # Signing is optional. Set all four secrets to get a release-signed APK
      # that can be updated in place; without them the job still produces a
      # debug-signed APK that installs fine for personal use.
      - name: Configure release signing
        id: signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        if: steps.signing.outputs.signed == 'true'
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Assemble debug APK
        if: steps.signing.outputs.signed != 'true'
        run: cd android && ./gradlew assembleDebug --no-daemon

      # Name the file after the version so downloads are self-describing, and
      # mark debug builds as such rather than shipping an ambiguous app.apk.
      - name: Collect APK
        id: collect
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) version="build-${GITHUB_RUN_NUMBER}" ;;
          esac
          suffix=""
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then suffix="-debug"; fi
          src=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$src" || { echo "no APK produced"; exit 1; }
          name="gold-calculator-${version}${suffix}.apk"
          cp "$src" "dist/$name"
          echo "apk_name=$name" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: gold-calculator-apk
          path: dist/*.apk
          if-no-files-found: error

      # Tag pushes also publish the APK as a downloadable release asset.
      # Done with the REST API rather than a third-party action: one less
      # dependency, and it works under org policies that restrict marketplace
      # actions. Re-running the same tag replaces the asset instead of failing.
      - name: Publish release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_NAME: ${{ steps.collect.outputs.apk_name }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          if [ "$SIGNED" = "true" ]; then
            note="موقّع بمفتاح الإصدار."
          else
            note="موقّع بمفتاح التصحيح (debug) — يثبّت ويشتغل للاستخدام الشخصي. التحديث لاحقاً بمفتاح إصدار يتطلب حذف النسخة المثبّتة."
          fi

          body=$(printf '## حاسبة الذهب %s\n\nنزّل `%s` من الأسفل وثبّته على جوالك (أندرويد 6.0 فأعلى).\nبيطلب منك أندرويد تفعيل "تثبيت من مصادر غير معروفة" أول مرة.\n\n%s\n\nكل الواجهة مضمّنة داخل التطبيق ويشتغل بدون إنترنت؛ الشبكة تُستخدم فقط لجلب سعر الذهب اللحظي.\n' "$GITHUB_REF_NAME" "$APK_NAME" "$note")

          # Reuse the release if this tag was published before.
          id=$(curl -sS "${auth[@]}" "$api/releases/tags/$GITHUB_REF_NAME" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            id=$(jq -n --arg t "$GITHUB_REF_NAME" --arg b "$body" \
                   '{tag_name:$t, name:("حاسبة الذهب " + $t), body:$b}' \
                 | curl -sS -X POST "${auth[@]}" -d @- "$api/releases" | jq -r '.id')
          fi
          test -n "$id" && [ "$id" != "null" ] || { echo "could not create release"; exit 1; }

          # Drop a same-named asset from a previous run of this tag.
          old=$(curl -sS "${auth[@]}" "$api/releases/$id/assets" \
                | jq -r --arg n "$APK_NAME" '.[] | select(.name==$n) | .id')
          for a in $old; do curl -sS -X DELETE "${auth[@]}" "$api/releases/assets/$a"; done

          curl -sS -X POST "${auth[@]}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"dist/$APK_NAME" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$APK_NAME" \
            | jq -r '"uploaded: " + .browser_download_url'
