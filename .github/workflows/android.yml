name: Build Android APK

# Produces an installable APK without needing a local Android toolchain.
# Run it from the Actions tab ("Run workflow"), then download the APK from the
# run's Artifacts section.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub release under this tag (e.g. v1.0.0). Leave empty to just build an APK artifact.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Signing secrets are read once at job level. A step-level `if:` cannot see
    # the `secrets` context (the workflow fails to parse), but it can see `env`,
    # which is how the optional signing step below decides whether to run.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu-latest image already ships an Android SDK, so it is used
      # directly. android-actions/setup-android@v3 was tried first and fails on
      # this image: it asks sdkmanager for the long-obsolete `tools` package,
      # which no longer exists in the repository ("Failed to find package
      # 'tools'", exit 1) and takes the whole job down with it.
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk" || { echo "no Android SDK on this runner"; exit 1; }
          manager=$(find "$sdk/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          test -n "$manager" || { echo "sdkmanager not found under $sdk"; exit 1; }
          echo "using $manager"
          yes | "$manager" --licenses > /dev/null 2>&1 || true
          "$manager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
          } >> "$GITHUB_ENV"

      # One place decides what this run is: a plain artifact build, or a
      # release. Everything downstream reads these two outputs.
      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"; release=true
          else
            case "$GITHUB_REF" in
              refs/tags/*) tag="$GITHUB_REF_NAME"; release=true ;;
              *)           tag="build-${GITHUB_RUN_NUMBER}"; release=false ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $tag (release: $release)"

      - run: npm ci

      # Guard the release: a broken calculation must not reach a phone.
      - name: Run pricing engine tests
        run: npm test

      - name: Build web assets and sync to Android
        run: npm run android:sync

      # Signing is optional. Set all four secrets to get a release-signed APK
      # that can be updated in place; without them the job still produces a
      # debug-signed APK that installs fine for personal use.
      - name: Configure release signing
        id: signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        if: steps.signing.outputs.signed == 'true'
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Assemble debug APK
        if: steps.signing.outputs.signed != 'true'
        run: cd android && ./gradlew assembleDebug --no-daemon

      # Name the file after the version so downloads are self-describing, and
      # mark debug builds as such rather than shipping an ambiguous app.apk.
      - name: Collect APK
        id: collect
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          version="$VERSION"
          suffix=""
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then suffix="-debug"; fi
          src=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$src" || { echo "no APK produced"; exit 1; }
          name="gold-calculator-${version}${suffix}.apk"
          cp "$src" "dist/$name"
          echo "apk_name=$name" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: gold-calculator-apk
          path: dist/*.apk
          if-no-files-found: error

      # Tag pushes also publish the APK as a downloadable release asset.
      # Done with the REST API rather than a third-party action: one less
      # dependency, and it works under org policies that restrict marketplace
      # actions. Re-running the same tag replaces the asset instead of failing.
      - name: Publish release with APK
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_NAME: ${{ steps.collect.outputs.apk_name }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          if [ "$SIGNED" = "true" ]; then
            note="موقّع بمفتاح الإصدار."
          else
            note="موقّع بمفتاح التصحيح (debug) — يثبّت ويشتغل للاستخدام الشخصي. التحديث لاحقاً بمفتاح إصدار يتطلب حذف النسخة المثبّتة."
          fi

          body=$(printf '## حاسبة الذهب %s\n\nنزّل `%s` من الأسفل وثبّته على جوالك (أندرويد 6.0 فأعلى).\nبيطلب منك أندرويد تفعيل "تثبيت من مصادر غير معروفة" أول مرة.\n\n%s\n\nكل الواجهة مضمّنة داخل التطبيق ويشتغل بدون إنترنت؛ الشبكة تُستخدم فقط لجلب سعر الذهب اللحظي.\n' "$TAG" "$APK_NAME" "$note")

          # When the run was dispatched rather than triggered by a tag push,
          # the tag does not exist yet — create it on the commit just built.
          if ! curl -sfS "${auth[@]}" "$api/git/ref/tags/$TAG" > /dev/null 2>&1; then
            jq -n --arg r "refs/tags/$TAG" --arg s "$GITHUB_SHA" '{ref:$r, sha:$s}' \
              | curl -sS -X POST "${auth[@]}" -d @- "$api/git/refs" \
              | jq -r '"tag: " + (.ref // .message)'
          fi

          # Reuse the release if this tag was published before.
          id=$(curl -sS "${auth[@]}" "$api/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            id=$(jq -n --arg t "$TAG" --arg b "$body" \
                   '{tag_name:$t, name:("حاسبة الذهب " + $t), body:$b}' \
                 | curl -sS -X POST "${auth[@]}" -d @- "$api/releases" | jq -r '.id')
          fi
          test -n "$id" && [ "$id" != "null" ] || { echo "could not create release"; exit 1; }

          # Drop a same-named asset from a previous run of this tag.
          old=$(curl -sS "${auth[@]}" "$api/releases/$id/assets" \
                | jq -r --arg n "$APK_NAME" '.[] | select(.name==$n) | .id')
          for a in $old; do curl -sS -X DELETE "${auth[@]}" "$api/releases/assets/$a"; done

          curl -sS -X POST "${auth[@]}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"dist/$APK_NAME" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$APK_NAME" \
            | jq -r '"uploaded: " + .browser_download_url'
