// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        // Google's GCS mirror of Maven Central, tried first: the canonical
        // repo.maven.apache.org rate-limits shared/CI egress IPs with HTTP 429,
        // which fails the build on dependency resolution. mavenCentral() stays
        // below as the authoritative fallback.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // Google's GCS mirror of Maven Central, tried first: the canonical
        // repo.maven.apache.org rate-limits shared/CI egress IPs with HTTP 429,
        // which fails the build on dependency resolution. mavenCentral() stays
        // below as the authoritative fallback.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2' }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
