<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>خريطة قدرات البنك المركزي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0A1412; --bg-2:#0F1C18; --surface:#142420; --surface-2:#1B2F29; --line:#25392F; --line-2:#35504A;
  --ink:#EAF0EC; --ink-2:#B9C7C0; --muted:#7F9389;
  --cap:#3FBF97; --cap-ink:#8EE3C6; --cap-dim:#1F5A48;
  --gold:#E0B45C; --gold-soft:#3D3419;
  --tech:#6FA8FF; --gov:#E0B45C; --ops:#B693F5; --org:#F28FB8;
  --good:#59D08A; --warn:#F4C25B; --crit:#F0665E;
  --seq1:#173A30; --seq2:#1E5443; --seq3:#276E56; --seq4:#328A6B; --seq5:#3FA57F; --seq6:#63C39C; --seq7:#9BE0C4;
  --shadow:0 2px 6px rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.35);
  --font:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --disp:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;
}
*{box-sizing:border-box}
svg{direction:ltr}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;direction:rtl;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
select,input{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-columns:232px 1fr;background:
  radial-gradient(1200px 600px at 85% -10%,rgba(63,191,151,.10),transparent 60%),
  radial-gradient(900px 500px at 10% 110%,rgba(224,180,92,.07),transparent 60%),var(--bg)}
/* rail */
.rail{border-inline-start:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:14px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:800;font-size:14px;padding:4px 6px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--cap);display:grid;place-items:center;flex-shrink:0}
.brand small{display:block;font-family:var(--font);font-weight:400;font-size:11px;color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
.acts button{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;text-align:start;padding:8px 8px;border-radius:9px;color:var(--ink-2);font-size:13px;line-height:1.35}
.acts button b{font-weight:500;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;text-align:center;border:1px solid var(--line-2);border-radius:6px;padding:1px 0}
.acts button:hover{background:var(--surface)}
.acts button.on{background:var(--surface-2);color:var(--ink)}
.acts button.on b{background:var(--cap);border-color:var(--cap);color:#06201A;font-weight:700}
.acts button.done b{color:var(--cap)}
.rail .hint{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.7}
.rail .hint kbd{font-family:inherit;border:1px solid var(--line-2);border-radius:5px;padding:0 6px;font-size:11px;color:var(--ink-2)}

/* stage */
.stage{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0;padding:22px 28px 14px}
.stage-head{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-bottom:14px;border-bottom:1px solid var(--line)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--gold)}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--gold)}
.stage-head h1{font-size:clamp(19px,2.2vw,27px);font-weight:800;margin-top:6px}
.stage-head .lead{font-size:13.5px;color:var(--ink-2);max-width:78ch;margin-top:4px}
.stage-head .tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.scene{min-height:0;min-width:0;position:relative;padding-top:16px}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.ctl .btns{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;color:var(--ink);background:var(--surface)}
.btn:hover{border-color:var(--cap);background:var(--surface-2)}
.btn.primary{background:var(--cap);color:#06201A;border-color:var(--cap);font-weight:600}
.btn.primary:hover{background:var(--cap-ink)}
.btn.small{padding:4px 10px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--surface-2);border-color:var(--cap);color:var(--cap-ink)}
.steps{display:flex;gap:6px;align-items:center;justify-content:center}
.steps i{width:22px;height:4px;border-radius:2px;background:var(--line-2);display:block;transition:background .3s}
.steps i.on{background:var(--cap)}
.steps i.past{background:var(--cap-dim)}
.progress{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px}
.progress .bar{width:120px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--gold);transition:width .4s}

/* generic scene pieces */
.split{display:grid;grid-template-columns:1fr 320px;gap:18px;height:100%;min-height:0}
.split.wide{grid-template-columns:1fr 380px}
.viz{position:relative;min-height:0;min-width:0;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.viz svg{display:block;width:100%;height:100%}
.viz .overlay{position:absolute;inset:auto 14px 12px auto;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.viz .overlay.top{inset:12px 14px auto auto}
.viz .overlay.bl{inset:auto auto 12px 14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.panel h3{font-size:14px;font-weight:600;color:var(--ink)}
.panel .sub{font-size:12.5px;color:var(--muted)}
.panel hr{border:0;border-top:1px solid var(--line);margin:2px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;background:var(--surface-2);color:var(--ink-2);line-height:1.6;border:1px solid transparent}
.chip.cap{background:rgba(63,191,151,.14);color:var(--cap-ink)}
.chip.gold{background:rgba(224,180,92,.14);color:var(--gold)}
.chip.crit{border-color:var(--crit);color:var(--crit);background:transparent}
.chip.good{border-color:var(--good);color:var(--good);background:transparent}
.chip.warn{border-color:var(--warn);color:var(--warn);background:transparent}
.chip.tech{background:rgba(111,168,255,.14);color:var(--tech)}
.chip.ops{background:rgba(182,147,245,.14);color:var(--ops)}
.chip.org{background:rgba(242,143,184,.14);color:var(--org)}
.chip.gov{background:rgba(224,180,92,.14);color:var(--gov)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;font-family:var(--disp)}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--surface-2);font-size:12.5px}
.row .n{font-weight:500}.row .s{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.sq{border-radius:2px}
select.sel{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;max-width:100%;font-size:13px}
.tip{position:fixed;z-index:50;background:#F3F6F4;color:#0B1614;font-size:12px;padding:8px 10px;border-radius:8px;pointer-events:none;max-width:260px;line-height:1.5;box-shadow:var(--shadow)}
.tip b{font-weight:600}
.crumb{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.crumb button{padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.crumb button:hover{color:var(--ink)}
.crumb .sep{color:var(--muted)}

/* title act */
.title-act{height:100%;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.title-act h2{font-size:clamp(28px,3.6vw,50px);font-weight:800;line-height:1.3}
.title-act .lead{font-size:16px;color:var(--ink-2);max-width:60ch;margin-top:18px}
.title-act .cta{margin-top:26px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.counter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.counter .v{font-family:var(--disp);font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--cap-ink)}
.counter .v.gold{color:var(--gold)}
.counter .l{font-size:12.5px;color:var(--ink-2);margin-top:8px}

/* law act */
.law-svg text{font-family:var(--font);fill:var(--ink)}
.law-svg .task rect{fill:var(--surface);stroke:var(--line-2)}
.law-svg .task text{font-size:12px}
.law-svg .task .art{fill:var(--gold);font-size:10.5px}
.law-svg .capn rect{fill:rgba(63,191,151,.16);stroke:var(--cap)}
.law-svg .capn.sup rect{fill:rgba(224,180,92,.14);stroke:var(--gold)}
.law-svg .capn text{font-size:12px;font-weight:600}
.law-svg .flow{fill:none;stroke:var(--cap);stroke-width:1.5;opacity:.7}
.law-svg .hdr{font-size:12px;fill:var(--muted)}

/* sunburst */
.sb path{stroke:var(--bg-2);stroke-width:1.2;cursor:pointer}
.sb text{font-family:var(--font);fill:var(--ink);font-size:10.5px;pointer-events:none;user-select:none}
.sb .center{cursor:pointer}
.sb .ct{font-family:var(--disp);font-weight:700;font-size:13px;fill:var(--ink);text-anchor:middle;pointer-events:none}
.sb .cs{font-size:11px;fill:var(--muted);text-anchor:middle;pointer-events:none}

/* graph */
.g text{font-family:var(--font);fill:var(--ink);pointer-events:none;user-select:none}
.g .link{stroke:var(--line-2);stroke-opacity:.7;stroke-width:1.1}
.g .link.tree{stroke:var(--cap);stroke-opacity:.5;stroke-width:1.6}
.g .node{cursor:grab}
.g .node.dim{opacity:.12}
.g .link.dim{opacity:.06}
.g .node.hit path,.g .node.hit circle{filter:drop-shadow(0 0 6px currentColor)}
.g .lbl{font-size:11px;paint-order:stroke;stroke:var(--bg-2);stroke-width:3px;stroke-linejoin:round}
.g .lbl.cap{font-weight:600;font-size:12px}
.g .link.wave{stroke:var(--gold);stroke-opacity:1;stroke-width:2}
.pulse{animation:pulse 1.2s ease-out 2}
@keyframes pulse{0%{stroke-width:2;opacity:1}100%{stroke-width:18;opacity:0}}

/* bars */
.bars text{font-family:var(--font);fill:var(--ink);font-size:12px}
.bars .lbl{fill:var(--ink-2)}
.bars .v{fill:var(--muted);font-size:11px}
.bars .axis line,.bars .axis path{stroke:var(--line)}
.bars .axis text{fill:var(--muted);font-size:10.5px}
.sliders{display:grid;gap:12px}
.sl{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center;font-size:12.5px}
.sl input{width:100%;accent-color:var(--cap)}
.sl .v{text-align:center;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.gauge{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.gauge svg{width:100%;height:auto;display:block}
.gauge .l{font-size:11.5px;color:var(--ink-2);line-height:1.4}
.gauge text{font-family:var(--disp);fill:var(--ink);font-weight:700}

/* table act */
.table-svg text{font-family:var(--font);fill:var(--ink);font-size:11.5px}
.seat rect{fill:var(--surface);stroke:var(--line-2)}
.seat.chair rect{fill:rgba(63,191,151,.18);stroke:var(--cap)}
.seat.guest rect{stroke-dasharray:4 3}
.seat .role{fill:var(--muted);font-size:10px}

/* queries */
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.q{text-align:start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px;line-height:1.5;display:grid;gap:4px}
.q small{color:var(--muted);font-size:11.5px}
.q:hover{border-color:var(--line-2)}
.q.on{border-color:var(--cap);background:var(--surface-2)}
.answer{display:grid;grid-template-rows:auto 1fr;gap:14px;min-height:0}
.answer .big{font-family:var(--disp);font-size:64px;font-weight:800;color:var(--cap-ink);line-height:1;font-variant-numeric:tabular-nums}
.answer .how{font-size:12.5px;color:var(--ink-2)}
.answer .how b{color:var(--gold)}

/* closing */
.close{height:100%;display:grid;grid-template-rows:auto 1fr;gap:20px}
.close .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-content:start}
.close .c{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s}
.close .c.in{opacity:1;transform:none}
.close .c h3{font-size:16px;margin-bottom:8px}
.close .c p{font-size:13.5px;color:var(--ink-2)}
.close .c .k{font-family:var(--disp);font-size:34px;font-weight:800;color:var(--gold);line-height:1;margin-bottom:10px}

.fade{opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease}
.fade.in{opacity:1;transform:none}

@media (max-width:1000px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{border:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;padding:10px 14px;gap:10px;overflow:auto}
  .acts{flex-direction:row;overflow:auto}
  .acts button{grid-template-columns:18px auto;white-space:nowrap;padding:5px 8px}
  .rail .hint{display:none}
  .stage{padding:14px 16px 10px;overflow:auto;grid-template-rows:auto auto auto}
  .scene{min-height:520px}
  .split,.split.wide,.title-act,.qgrid{grid-template-columns:1fr}
  .viz{min-height:380px}
  .close .cards{grid-template-columns:1fr}
  .stage-head{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="app" lang="ar">
  <aside class="rail">
    <div class="brand"><span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#06201A" stroke-width="1.7"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></span><span>خريطة القدرات المؤسسية<small>عرض تفاعلي لمعالي نائب المحافظ</small></span></div>
    <div class="acts" id="acts"></div>
    <div class="hint">التنقل: <kbd>مسافة</kbd> أو <kbd>←</kbd> للتالي، <kbd>→</kbd> للسابق، <kbd>F</kbd> ملء الشاشة. كل فصل يحتوي خطوات تُبنى تدريجيًا.</div>
  </aside>
  <main class="stage">
    <header class="stage-head"><div><span class="eyebrow" id="hdEyebrow"></span><h1 id="hdTitle"></h1><p class="lead" id="hdLead"></p></div><div class="tools" id="hdTools"></div></header>
    <div class="scene" id="scene"></div>
    <footer class="ctl">
      <div class="btns"><button class="btn" id="btnPrev">السابق</button><button class="btn primary" id="btnNext">التالي</button></div>
      <div class="steps" id="steps"></div>
      <div class="progress"><span id="progTxt"></span><span class="bar"><i id="progBar"></i></span><button class="btn small" id="btnFull" title="ملء الشاشة">⛶</button></div>
    </footer>
  </main>
</div>
<div class="tip" id="tip" hidden></div>
<script>
(function(){
'use strict';
/* ---------- بيانات القدرات ---------- */
const CAPS=[
 {n:'السياسة النقدية',task:'وضع السياسة النقدية وتنفيذها',gd:'الإدارة العامة للسياسة النقدية',sys:['نظام إدارة السيولة','منصة التحليل النقدي','نظام عمليات السوق المفتوحة'],svc:['نافذة الإيداع والإقراض للبنوك'],l1:[
  {n:'صياغة السياسة النقدية',l2:['تحليل التطورات النقدية','نمذجة التضخم والتوقعات','تحديد موقف السياسة']},
  {n:'تنفيذ عمليات السوق',l2:['عمليات إعادة الشراء','أدوات السيولة الطارئة','إدارة السيولة اليومية']},
  {n:'إدارة سعر الصرف',l2:['إدارة ربط الريال','عمليات سوق الصرف']},
  {n:'الاحتياطي النظامي',l2:['تحديد نسب الاحتياطي','احتساب الالتزام ومتابعته']}]},
 {n:'إصدار العملة وإدارتها',task:'إصدار العملة الوطنية وإدارتها',gd:'الإدارة العامة للعملة',sys:['نظام إدارة المخزون النقدي','نظام مراكز النقد','منصة تتبع الفئات'],svc:['تزويد البنوك بالنقد','استبدال العملة التالفة'],l1:[

  {n:'توزيع النقد',l2:['تخطيط الطلب على النقد','تشغيل مراكز النقد','نقل النقد وتأمينه']},
  {n:'جودة النقد وسحبه',l2:['فرز التالف وإتلافه','مكافحة التزييف']},
  {n:'العملة الرقمية',l2:['تجارب الريال الرقمي','إطار الإصدار الرقمي']}]},
 {n:'إدارة الاحتياطيات والاستثمار',task:'إدارة احتياطيات الدولة من النقد الأجنبي',gd:'الإدارة العامة للاستثمار',sys:['نظام إدارة المحافظ','نظام الخزينة والتسوية','منصة قياس المخاطر'],svc:null,l1:[
  {n:'استراتيجية الاستثمار',l2:['التوزيع الاستراتيجي للأصول','سياسة المخاطر الاستثمارية']},
  {n:'إدارة المحافظ',l2:['المحافظ الداخلية','مديرو الأصول الخارجيون','أدوات الدخل الثابت']},
  {n:'عمليات الخزينة والتسوية',l2:['التسوية والحفظ','إدارة الضمانات']},
  {n:'قياس الأداء والمخاطر',l2:['قياس أداء المحافظ','مخاطر السوق والائتمان']}]},
 {n:'الخدمات المصرفية للحكومة',task:'القيام بأعمال مصرف الحكومة',gd:'الإدارة العامة للعمليات المصرفية',sys:['نظام الحسابات الحكومية','نظام التحويلات الحكومية'],svc:['فتح الحسابات الحكومية','صرف المستحقات الحكومية','التحويلات الدولية للجهات الحكومية'],l1:[

function showTip(html,x,y){tip.innerHTML=html;tip.hidden=false;const r=tip.getBoundingClientRect();let L=x-r.width/2;L=Math.max(8,Math.min(window.innerWidth-r.width-8,L));let T=y-r.height-14;if(T<8)T=y+16;tip.style.left=L+'px';tip.style.top=T+'px'}
function hideTip(){tip.hidden=true}
function countUp(el,to,ms,suffix){const from=+(el.dataset.v||0);el.dataset.v=to;if(!dur(1)){el.textContent=fmt(to)+(suffix||'');return}const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/ms);const e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e)+(suffix||'');if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function wrap(t,max){const w=String(t).split(' ');const out=[];let cur='';w.forEach(x=>{if((cur+' '+x).trim().length>max&&cur){out.push(cur.trim());cur=x}else cur+=' '+x});if(cur.trim())out.push(cur.trim());return out}
function tspans(sel,lines,x,lh){sel.text(null);lines.forEach((l,i)=>sel.append('tspan').attr('x',x).attr('dy',i?lh:0).text(l))}
function ownerUnitCount(l0){return new Set(l0.l1.map(x=>x.unit).filter(Boolean)).size}
function heat(l1){return l1.proc?l1.proc.auto:null}
function l0heat(l0){const v=l0.l1.map(heat).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function seqColor(v,lo,hi){const t=(v-lo)/Math.max(1,hi-lo);return SEQ[Math.min(6,Math.floor(t*6.999))]}
const PW={reg:4,risk:3,vis:3,ext:2};
function prioScore(l0,w){w=w||PW;const tw=Object.values(w).reduce((a,b)=>a+b,0)||1;return Object.keys(w).reduce((a,k)=>a+w[k]*l0.scores[k],0)/tw}
const tier=s=>s>=3.8?['عالية',C.crit]:s>=2.8?['متوسطة',C.warn]:['منخفضة',C.muted];
function gapsOf(l1){const g=[];if(!l1.proc)g.push('proc');if(!l1.policy&&!l1.l0.policy)g.push('pol');if(l1.l0.sup&&!l1.reg)g.push('reg');if(!l1.l2.some(x=>x.sys.length))g.push('sys');if(!l1.unit)g.push('own');return g}
const GAPN={proc:'بلا إجراء عمل',pol:'بلا سياسة',reg:'بلا أداة تنظيمية',sys:'بلا نظام تقني',own:'بلا وحدة مالكة'};
function elementsUnder(l0){return l0.l1.reduce((a,x)=>a+(x.proc?1:0)+(x.policy?1:0)+(x.reg?1:0)+(x.unit?1:0)+(x.committee?1:0)+x.l2.reduce((b,y)=>b+y.sys.length+1+(y.svc?1:0),0),0)+(l0.policy?1:0)+(l0.committee?1:0)}

/* ---------- الرسم الشمسي القابل للتكبير ---------- */
function makeSunburst(el,opts){
  opts=opts||{};
  const W=el.clientWidth||700,H=el.clientHeight||560;const size=Math.min(W,H)-16;const radius=size/2/3.05;
  const data={n:'البنك المركزي',children:M.l0.map(l0=>({ref:l0,children:l0.l1.map(l1=>({ref:l1,children:l1.l2.map(l2=>({ref:l2,value:1}))}))}))};
  const root=d3.hierarchy(data).sum(d=>d.value||0);
  d3.partition().size([2*Math.PI,root.height+1])(root);
  root.each(d=>d.current=d);
  const arc=d3.arc().startAngle(d=>d.x0).endAngle(d=>d.x1).padAngle(d=>Math.min((d.x1-d.x0)/2,0.004)).padRadius(radius*1.5).innerRadius(d=>d.y0*radius).outerRadius(d=>Math.max(d.y0*radius,d.y1*radius-1.5));
  const svg=d3.select(el).append('svg').attr('viewBox',[-W/2,-H/2,W,H]).attr('class','sb');
  const defs=svg.append('defs');
  defs.append('pattern').attr('id','hatch').attr('width',6).attr('height',6).attr('patternUnits','userSpaceOnUse').attr('patternTransform','rotate(45)').call(p=>{p.append('rect').attr('width',6).attr('height',6).attr('fill','#1B2F29');p.append('rect').attr('width',2).attr('height',6).attr('fill','#35504A')});
  const g=svg.append('g');
  let mode=opts.mode||'src',maxDepth=opts.maxDepth||3,focus=root,gapSet=opts.gapSet||new Set(['proc']);
  const autoVals=M.l1.map(heat).filter(x=>x!==null);const lo=Math.min(...autoVals),hi=Math.max(...autoVals);
  function refOf(d){return d.data.ref}
  function l1Of(d){const r=refOf(d);return r.lvl===1?r:r.lvl===2?r.l1:null}
  function l0Of(d){const r=refOf(d);return r.lvl===0?r:r.lvl===1?r.l0:r.l1.l0}
  function fill(d){
    const r=refOf(d);
    if(mode==='src'){return l0Of(d).task?C.cap:C.gold}
    if(mode==='auto'){let v=r.lvl===0?l0heat(r):heat(l1Of(d));return v===null?'url(#hatch)':seqColor(v,lo,hi)}
    if(mode==='prio'){return tier(prioScore(l0Of(d)))[1]}
    if(mode==='gap'){const has=x=>gapsOf(x).some(k=>gapSet.has(k));const bad=r.lvl===0?r.l1.some(has):has(l1Of(d));return bad?C.crit:'#22362E'}
    return C.cap}
  function opac(d){if(mode==='src')return d.depth===1?1:d.depth===2?.72:.5;if(mode==='gap'){const r=refOf(d);return 1}return d.depth===1?1:d.depth===2?.9:.75}
  function arcVisible(d){return d.y1<=3&&d.y0>=1&&d.x1>d.x0&&d.depth<=maxDepth}
  function labelVisible(d){return d.y1<=3&&d.y0>=1&&d.depth<=maxDepth&&(d.y1-d.y0)*(d.x1-d.x0)>(d.depth===3?0.05:0.03)}
  function labelTransform(d){const x=(d.x0+d.x1)/2*180/Math.PI;const y=(d.y0+d.y1)/2*radius;return `rotate(${x-90}) translate(${y},0) rotate(${x<180?0:180})`}
  const path=g.append('g').selectAll('path').data(root.descendants().slice(1)).join('path')
    .attr('fill',fill).attr('fill-opacity',d=>arcVisible(d.current)?opac(d):0).attr('pointer-events',d=>arcVisible(d.current)?'auto':'none').attr('d',d=>arc(d.current));
  path.on('click',(e,d)=>{if(d.children&&d.depth<3){zoom(d)}if(opts.onSelect)opts.onSelect(refOf(d),d)})
    .on('mousemove',(e,d)=>{const r=refOf(d);const l1=l1Of(d);let extra='';if(mode==='auto'){const v=r.lvl===0?l0heat(r):heat(l1);extra='نسبة الأتمتة: '+(v===null?'لا إجراء':Math.round(v)+'%')}else if(mode==='prio'){extra='الأولوية: '+tier(prioScore(l0Of(d)))[0]+' ('+prioScore(l0Of(d)).toFixed(1)+')'}else if(mode==='gap'&&l1){const gs=gapsOf(l1).filter(k=>gapSet.has(k));extra=gs.length?gs.map(k=>GAPN[k]).join('، '):'مغطاة'}else{extra=r.lvl===0?(r.task?'مستمدة من النظام: '+r.task:'قدرة مساندة'):r.lvl===1?(r.l2.length+' قدرة تفصيلية · '+(r.unit?r.unit.n:'بلا مالك')):(r.sys.length+' نظام · '+(r.svc?'خدمة':'بلا خدمة'))}
      showTip(`<b>${esc(r.n)}</b><br><span style="opacity:.7">المستوى ${r.lvl}</span><br>${esc(extra)}`,e.clientX,e.clientY)})
    .on('mouseleave',hideTip);
  const label=g.append('g').attr('pointer-events','none').selectAll('text').data(root.descendants().slice(1)).join('text')
    .attr('dy','0.35em').attr('text-anchor','middle').attr('fill-opacity',d=>+labelVisible(d.current)).attr('transform',d=>labelTransform(d.current))
    .attr('font-size',d=>d.depth===1?11.5:d.depth===2?10.5:9.5).attr('font-weight',d=>d.depth===1?600:400)
    .text(d=>{const n=refOf(d).n;const max=d.depth===1?16:d.depth===2?18:16;return n.length>max?n.slice(0,max-1)+'…':n});
  const center=g.append('g').attr('class','center').on('click',()=>{if(focus.parent)zoom(focus.parent)});
  center.append('circle').attr('r',radius-4).attr('fill','#142420').attr('stroke','#25392F');
  const ct=center.append('text').attr('class','ct').attr('y',-4);
  const cs=center.append('text').attr('class','cs').attr('y',16);
  function setCenter(){const r=focus.data.ref;const n=r?r.n:'البنك المركزي';const lines=wrap(n,14).slice(0,3);tspans(ct,lines,0,15);ct.attr('y',-4-(lines.length-1)*7);cs.attr('y',16+(lines.length-1)*8).text(focus===root?M.l0.length+' قدرة رئيسية':focus.depth===1?r.l1.length+' فرعية · '+r.l1.reduce((a,x)=>a+x.l2.length,0)+' تفصيلية':r.l2.length+' قدرة تفصيلية · اضغط للرجوع')}
  setCenter();
  function zoom(p){
    focus=p;setCenter();if(opts.onZoom)opts.onZoom(p);
    root.each(d=>d.target={x0:Math.max(0,Math.min(1,(d.x0-p.x0)/(p.x1-p.x0)))*2*Math.PI,x1:Math.max(0,Math.min(1,(d.x1-p.x0)/(p.x1-p.x0)))*2*Math.PI,y0:Math.max(0,d.y0-p.depth),y1:Math.max(0,d.y1-p.depth)});
    const t=g.transition().duration(dur(700));
    path.transition(t).tween('data',d=>{const i=d3.interpolate(d.current,d.target);return t=>d.current=i(t)})
      .filter(function(d){return +this.getAttribute('fill-opacity')||arcVisible(d.target)})
      .attr('fill-opacity',d=>arcVisible(d.target)?opac(d):0).attr('pointer-events',d=>arcVisible(d.target)?'auto':'none').attrTween('d',d=>()=>arc(d.current));
    label.filter(function(d){return +this.getAttribute('fill-opacity')||labelVisible(d.target)}).transition(t).attr('fill-opacity',d=>+labelVisible(d.target)).attrTween('transform',d=>()=>labelTransform(d.current));
  }
  function repaint(ms){path.transition().duration(dur(ms==null?500:ms)).attr('fill',fill).attr('fill-opacity',d=>arcVisible(d.current)?opac(d):0).attr('pointer-events',d=>arcVisible(d.current)?'auto':'none');label.transition().duration(dur(ms==null?500:ms)).attr('fill-opacity',d=>+labelVisible(d.current))}
  return {
    setMaxDepth(n,ms){maxDepth=n;repaint(ms)},
    setMode(m){mode=m;repaint()},
    setGaps(s){gapSet=s;repaint(300)},
    zoomTo(ref){const d=root.descendants().find(x=>x.data.ref===ref);if(d)zoom(d)},
    reset(){zoom(root)},
    root
  };
}

/* ---------- شبكة القوى ---------- */
function buildGraph(l0s){
  const nodes=[],links=[],byId={};
  const add=(id,o)=>{if(!byId[id]){byId[id]=Object.assign({id},o);nodes.push(byId[id])}return byId[id]};
  const link=(a,b,k)=>links.push({source:a.id,target:b.id,k:k||'el'});
  l0s.forEach(l0=>{
    const n0=add(l0.id,{t:'cap',lvl:0,ref:l0,n:l0.n});
    if(l0.policy)link(add('pol:'+l0.policy.n,{t:'pol',n:l0.policy.n,at:0}),n0);
    if(l0.committee)link(add('comm:'+l0.committee.n,{t:'comm',n:l0.committee.n,at:0}),n0);
    l0.l1.forEach(l1=>{
      const n1=add(l1.id,{t:'cap',lvl:1,ref:l1,n:l1.n});link(n0,n1,'tree');
      if(l1.unit)link(add('unit:'+l1.unit.n,{t:'unit',n:l1.unit.n,at:1,ref:l1.unit}),n1);
      if(l1.proc)link(add('proc:'+l1.proc.n,{t:'proc',n:l1.proc.n,at:1,ref:l1.proc}),n1);
      if(l1.policy)link(add('pol:'+l1.policy.n,{t:'pol',n:l1.policy.n,at:1}),n1);
      if(l1.reg)link(add('reg:'+l1.reg.n,{t:'reg',n:l1.reg.n,at:1}),n1);
      if(l1.committee)link(add('comm:'+l1.committee.n,{t:'comm',n:l1.committee.n,at:1}),n1);
      l1.l2.forEach(l2=>{
        const n2=add(l2.id,{t:'cap',lvl:2,ref:l2,n:l2.n});link(n1,n2,'tree');
        l2.sys.forEach(s=>link(add('sys:'+s,{t:'sys',n:s,at:2}),n2));
        link(add('perm:'+l2.id,{t:'perm',n:l2.perm.n,at:2,ref:l2.perm}),n2);
        if(l2.svc)link(add('svc:'+l2.svc,{t:'svc',n:l2.svc,at:2}),n2);
      });
    });
  });
  return {nodes,links};
}
function makeGraph(el,l0s,opts){
  opts=opts||{};
  const W=el.clientWidth||800,H=el.clientHeight||560;
  const G=buildGraph(l0s);
  const svg=d3.select(el).append('svg').attr('viewBox',[0,0,W,H]).attr('class','g');
  const gz=svg.append('g');
  const gl=gz.append('g'),gn=gz.append('g');
  svg.call(d3.zoom().scaleExtent([.35,4]).on('zoom',e=>{gz.attr('transform',e.transform);gn.selectAll('.lbl.el').attr('opacity',e.transform.k>1.5?1:0)}));
  const vis=new Set(opts.vis||Object.keys(TYPES));
  const adj={};G.links.forEach(l=>{(adj[l.source]=adj[l.source]||new Set()).add(l.target);(adj[l.target]=adj[l.target]||new Set()).add(l.source)});
  const rad=d=>d.t==='cap'?(d.lvl===0?24:d.lvl===1?14:9):6;
  const sim=d3.forceSimulation().force('link',d3.forceLink().id(d=>d.id).distance(l=>l.k==='tree'?(l.source.lvl===0?110:60):30).strength(l=>l.k==='tree'?.9:.6))
    .force('charge',d3.forceManyBody().strength(d=>d.t==='cap'?(d.lvl===0?-500:d.lvl===1?-220:-90):-40))
    .force('collide',d3.forceCollide().radius(d=>rad(d)+6).iterations(2))
    .force('center',d3.forceCenter(W/2,H/2)).force('x',d3.forceX(W/2).strength(.04)).force('y',d3.forceY(H/2).strength(.06));
  let selected=null;
  function color(d){return d.t==='cap'?C.cap:GC[TYPES[d.t].g]}
  function render(){
    const nodes=G.nodes.filter(n=>n.t==='cap'||vis.has(n.t));const ids=new Set(nodes.map(n=>n.id));
    const links=G.links.filter(l=>ids.has(typeof l.source==='object'?l.source.id:l.source)&&ids.has(typeof l.target==='object'?l.target.id:l.target));
    const ln=gl.selectAll('line').data(links,l=>(l.source.id||l.source)+'|'+(l.target.id||l.target));
    ln.exit().remove();ln.enter().append('line').attr('class',l=>'link '+l.k).merge(ln);
    const nd=gn.selectAll('g.node').data(nodes,d=>d.id);
    nd.exit().transition().duration(dur(300)).attr('opacity',0).remove();
    const en=nd.enter().append('g').attr('class','node').attr('opacity',0).call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
    en.each(function(d){const g=d3.select(this);if(d.t==='cap'){g.append('circle').attr('r',rad(d)).attr('fill',d.lvl===0?C.cap:d.lvl===1?'#2A8C6E':'#1F5A48').attr('stroke',C.capInk).attr('stroke-width',d.lvl===0?2:1.2).attr('stroke-opacity',.6)}else{g.append('path').attr('d',d3.symbol().type(TYPES[d.t].sym).size(d.t==='comm'?60:110)).attr('fill',d.t==='comm'?'none':color(d)).attr('stroke',color(d)).attr('stroke-width',1.5)}
      g.append('text').attr('class','lbl '+(d.t==='cap'?'cap':'el')).attr('text-anchor','middle').attr('dy',rad(d)+12).attr('opacity',d.t==='cap'?1:0).text(d.n.length>22?d.n.slice(0,21)+'…':d.n)});
    en.on('click',(e,d)=>{e.stopPropagation();selectNode(d)}).on('mousemove',(e,d)=>{const at=d.t==='cap'?'قدرة · المستوى '+d.lvl:TYPES[d.t].n+' · مرتبط بالمستوى '+d.at;const deg=(adj[d.id]||new Set()).size;showTip(`<b>${esc(d.n)}</b><br>${at}<br>${deg} ارتباط`,e.clientX,e.clientY)}).on('mouseleave',hideTip);
    en.transition().duration(dur(500)).attr('opacity',1);
    sim.nodes(nodes);sim.force('link').links(links);sim.alpha(.7).restart();
  }
  sim.on('tick',()=>{gl.selectAll('line').attr('x1',l=>l.source.x).attr('y1',l=>l.source.y).attr('x2',l=>l.target.x).attr('y2',l=>l.target.y);gn.selectAll('g.node').attr('transform',d=>`translate(${d.x},${d.y})`)});
  function selectNode(d){selected=d;const nb=adj[d.id]||new Set();gn.selectAll('g.node').classed('dim',n=>d&&n!==d&&!nb.has(n.id));gl.selectAll('line').classed('dim',l=>d&&l.source!==d&&l.target!==d);gn.selectAll('g.node').filter(n=>n===d).raise();if(opts.onSelect)opts.onSelect(d,[...nb].map(id=>G.nodes.find(n=>n.id===id)))}
  svg.on('click',()=>{selected=null;gn.selectAll('g.node').classed('dim',false);gl.selectAll('line').classed('dim',false);if(opts.onSelect)opts.onSelect(null,[])});
  render();
  return {
    G,adj,svg,gn,gl,sim,
    setVis(types){vis.clear();types.forEach(t=>vis.add(t));render()},
    toggle(t){if(vis.has(t))vis.delete(t);else vis.add(t);render();return vis.has(t)},
    has(t){return vis.has(t)},
    selectId(id){const d=G.nodes.find(n=>n.id===id);if(d)selectNode(d)},
    clear(){gn.selectAll('g.node').classed('dim',false).classed('hit',false).each(function(d){const g=d3.select(this);if(d.t==='cap')g.select('circle').attr('fill',d.lvl===0?C.cap:d.lvl===1?'#2A8C6E':'#1F5A48').attr('stroke',C.capInk);else g.select('path').attr('fill',d.t==='comm'?'none':color(d)).attr('stroke',color(d));g.select('.lbl.el').attr('opacity',0)});gl.selectAll('line').classed('dim',false).classed('wave',false)},
    wave(hits,onHop){
      /* hits: Map(id -> action) على قدرات المستوى 2 */
      const hop={},act={},queue=[];hits.forEach((a,id)=>{hop[id]=0;act[id]=a;queue.push(id)});
      while(queue.length){const id=queue.shift();(adj[id]||[]).forEach(n=>{if(hop[n]===undefined){hop[n]=hop[id]+1;act[n]=act[id];queue.push(n)}})}
      const maxHop=Math.max(0,...Object.values(hop));
      gn.selectAll('g.node').classed('dim',d=>hop[d.id]===undefined);gl.selectAll('line').classed('dim',l=>hop[l.source.id]===undefined||hop[l.target.id]===undefined);
      for(let h=0;h<=maxHop;h++){
        setTimeout(()=>{
          const ns=gn.selectAll('g.node').filter(d=>hop[d.id]===h);
          ns.classed('hit',true).each(function(d){const g=d3.select(this);const col=ACT_COLOR[act[d.id]];g.style('color',col);g.select('circle').transition().duration(dur(350)).attr('fill',col).attr('stroke',col);g.select('path').transition().duration(dur(350)).attr('fill',d.t==='comm'?'none':col).attr('stroke',col);g.insert('circle','text').attr('r',rad(d)+2).attr('fill','none').attr('stroke',col).attr('class','pulse').transition().delay(dur(1300)).remove()});
          gl.selectAll('line').filter(l=>hop[l.source.id]===h-1&&hop[l.target.id]===h||hop[l.target.id]===h-1&&hop[l.source.id]===h).classed('wave',true);
          const reached=G.nodes.filter(n=>hop[n.id]!==undefined&&hop[n.id]<=h);
          if(onHop)onHop(h,reached,act,maxHop);
        },dur(h*650));
      }
      return maxHop;
    }
  };
}

 {q:'كم قدرة رقابية بلا أداة تنظيمية؟',sub:'قدرة رقابية مستوى 1 ← أداة تنظيمية',run(){const s=M.l1.filter(x=>x.l0.sup);const g=s.filter(x=>!x.reg);const by={};g.forEach(x=>by[x.l0.n]=(by[x.l0.n]||0)+1);return {big:g.length,unit:'من '+s.length+' قدرة رقابية',how:'المسار: <b>القدرات الرئيسية ذات الطابع الرقابي</b> ← <b>فروعها</b> ← <b>لا قواعد أو تعليمات مرتبطة</b>:',bars:Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v}))}}},
 {q:'كم قدرة تفصيلية تعمل بلا نظام تقني؟',sub:'قدرة مستوى 2 ← نظام',run(){const g=M.l2.filter(x=>!x.sys.length);const by={};g.forEach(x=>by[x.l1.l0.n]=(by[x.l1.l0.n]||0)+1);return {big:g.length,unit:'من '+M.l2.length+' قدرة تفصيلية',how:'المسار: <b>قدرة المستوى 2</b> ← <b>لا نظام مرتبط</b>. هذه خريطة الأتمتة المطلوبة:',bars:Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([l,v])=>({l,v}))}}},
 {q:'ما نسبة أتمتة القدرات المستمدة من النظام مقابل المساندة؟',sub:'إجراء ← نسبة الأتمتة',run(){const a=M.l1.filter(x=>x.l0.task&&x.proc),b=M.l1.filter(x=>!x.l0.task&&x.proc);const av=r=>Math.round(r.reduce((s,x)=>s+x.proc.auto,0)/r.length);return {big:av(a),unit:'% للقدرات المستمدة من النظام',how:'المسار: <b>القدرة الرئيسية (مصدرها)</b> ← <b>إجراءات فروعها</b> ← <b>متوسط الأتمتة</b>:',bars:[{l:'مستمدة من النظام',v:av(a)},{l:'مساندة',v:av(b)}]}}},
 {q:'أي وكيل محافظ تحته أكبر عدد من الصلاحيات؟',sub:'صلاحية ← المعتمد = وكيل',run(){const c={};M.l2.forEach(x=>{if(x.perm.approver.startsWith('وكيل'))c[x.perm.approver]=(c[x.perm.approver]||0)+1});const rows=Object.entries(c).sort((a,b)=>b[1]-a[1]);return {big:rows[0][1],unit:'صلاحية · '+rows[0][0],how:'المسار: <b>صلاحية</b> ← <b>المعتمد</b> مجمّعة حسب الوكيل:',bars:rows.map(([l,v])=>({l:l.replace('وكيل المحافظ ',''),v}))}}},
 {q:'كم لجنة تغطي أكثر من ثلاث قدرات فرعية؟',sub:'لجنة ← القدرة ← فروعها',run(){const c=M.l0.filter(x=>x.committee&&x.l1.length>3);return {big:c.length,unit:'لجنة',how:'المسار: <b>لجنة</b> ← <b>القدرة المرتبطة</b> ← <b>عدد فروعها</b>. كل واحدة يجب أن تضم مالكي هذه الفروع:',bars:c.map(x=>({l:x.committee.n.replace('لجنة ',''),v:x.l1.length}))}}}
];
ACTS.push({id:'query',eyebrow:'الفصل 8 · الاستعلامات',title:'أسئلة كانت تحتاج أسابيع من الجمع، تُجاب الآن من الخريطة',lead:'كل سؤال هو مسار على الشبكة نفسها: من العنصر إلى القدرة أو العكس. اختر سؤالًا.',steps:1,
  mount(root){
    root.innerHTML=`<div class="split wide"><div class="qgrid" id="qGrid" style="align-content:start;overflow:auto">${QUERIES.map((q,i)=>`<button class="q" data-i="${i}"><span>${esc(q.q)}</span><small>${esc(q.sub)}</small></button>`).join('')}</div><div class="panel answer"><div><div class="big" id="qBig">—</div><div class="sub" id="qUnit"></div><p class="how" id="qHow" style="margin-top:8px"></p></div><div class="viz" id="qViz" style="min-height:220px"></div></div></div>`;
    const self=this;root.querySelectorAll('.q').forEach(b=>b.addEventListener('click',()=>self.ask(+b.dataset.i)));this.ask(0);
  },
  ask(i){
    document.querySelectorAll('.q').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
    const r=QUERIES[i].run();const big=$('#qBig');big.dataset.v=0;countUp(big,r.big,900);$('#qUnit').textContent=r.unit;$('#qHow').innerHTML=r.how;
    const box=$('#qViz');box.innerHTML='';const W=box.clientWidth||340,H=Math.max(160,r.bars.length*30+20);
    const svg=d3.select(box).append('svg').attr('viewBox',[0,0,W,H]).attr('class','bars').style('height','auto');
    const mL=Math.min(170,W*.42);const x=d3.scaleLinear().domain([0,d3.max(r.bars,d=>d.v)||1]).range([0,W-mL-56]);
    const g=svg.append('g').attr('transform',`translate(${W-mL-8},10)`);
    const rows=g.selectAll('g').data(r.bars).join('g').attr('transform',(d,i)=>`translate(0,${i*30})`);
    rows.append('text').attr('class','lbl').attr('x',8).attr('y',15).attr('text-anchor','start').text(d=>d.l.length>24?d.l.slice(0,23)+'…':d.l);
    rows.append('rect').attr('x',0).attr('y',3).attr('height',18).attr('rx',3).attr('fill',C.cap).attr('width',0).transition().duration(dur(800)).attr('x',d=>-x(d.v)).attr('width',d=>x(d.v));
    rows.append('text').attr('class','v').attr('y',15).attr('text-anchor','end').attr('x',d=>-x(d.v)-5).attr('opacity',0).text(d=>d.v).transition().delay(dur(500)).attr('opacity',1);
  },setStep(){}});

/* 9 الخلاصة */
ACTS.push({id:'close',eyebrow:'الخلاصة',title:'ماذا يعني هذا لقيادة البنك؟',lead:'',steps:3,
  mount(root){root.innerHTML=`<div class="close"><div class="cards">
    <div class="c"><div class="k">1</div><h3>قرار مبني على خريطة</h3><p>أي مبادرة أو لجنة أو سياسة تبدأ من القدرة، فتظهر كل تبعاتها التشغيلية قبل اتخاذ القرار لا بعده. رأيناه في محاكاة الأثر: ${INITS.length} مبادرات، كل واحدة تعطي قائمة مراجعة كاملة في ثوانٍ.</p></div>
    <div class="c"><div class="k">2</div><h3>مستهدفات قابلة للقياس</h3><p>${M.l0.length} قدرة رئيسية تعني ${M.l0.length} سياسة، و${M.l1.length} قدرة فرعية تعني ${M.l1.length} إجراء عمل. الفجوة رقم، والإغلاق مسار محدد بالاسم والمالك.</p></div>
    <div class="c"><div class="k">3</div><h3>لغة واحدة للبنك</h3><p>الوحدات والأنظمة والصلاحيات والخدمات واللجان تُوصف بالمرجع نفسه، فيتحدث الجميع عن الشيء نفسه بالاسم نفسه، وتُجاب أسئلة القيادة من مصدر واحد.</p></div>
    </div><div class="panel" style="align-self:end"><h3>المطلوب من معالي النائب</h3><p class="sub">اعتماد المنهجية (الشمولية، الهرمية، الارتباطات) كمرجع رسمي لهيكلية الأعمال، وتكليف الوحدات بربط عناصرها التشغيلية بالقدرات وفق قاعدة أدق مستوى، لتصبح الخريطة مصدر الحقيقة الواحد للتخطيط والحوكمة.</p></div></div>`;
    this.cards=[...root.querySelectorAll('.c')]},
  setStep(s){this.cards.forEach((c,i)=>c.classList.toggle('in',i<=s))}});

/* ---------- محرك العرض ---------- */
let cur=0,step=0;
const actsEl=$('#acts');
function renderRail(){actsEl.innerHTML=ACTS.map((a,i)=>`<button class="${i===cur?'on':i<cur?'done':''}" data-i="${i}"><b>${i}</b><span>${a.id==='title'?'الافتتاح':a.eyebrow.replace(/^الفصل \d+ · /,'')}</span></button>`).join('');actsEl.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i,0)))}
function renderCtl(){const a=ACTS[cur];$('#steps').innerHTML=Array.from({length:a.steps},(_,i)=>`<i class="${i===step?'on':i<step?'past':''}"></i>`).join('');$('#progTxt').textContent=(cur+1)+' / '+ACTS.length;$('#progBar').style.width=((cur+ (step+1)/a.steps)/ACTS.length*100)+'%';$('#btnPrev').disabled=cur===0&&step===0;$('#btnNext').textContent=cur===ACTS.length-1&&step===a.steps-1?'النهاية':'التالي'}
function setHead(a){$('#hdEyebrow').textContent=a.eyebrow;$('#hdTitle').textContent=a.title;$('#hdLead').textContent=a.lead;$('#hdTitle').parentElement.style.display=a.id==='title'?'none':''}
function go(i,s){if(ACTS[cur].unmount)ACTS[cur].unmount();hdTools.innerHTML='';cur=i;step=s||0;const a=ACTS[i];scene.innerHTML='';setHead(a);a.mount(scene);a.setStep(step,true);renderRail();renderCtl();try{localStorage.setItem('cap-map-pos',cur+':'+step)}catch(e){}}
function next(){const a=ACTS[cur];if(step<a.steps-1){step++;a.setStep(step,false);renderCtl();try{localStorage.setItem('cap-map-pos',cur+':'+step)}catch(e){}}else if(cur<ACTS.length-1)go(cur+1,0)}
function prev(){if(step>0){go(cur,step-1)}else if(cur>0)go(cur-1,ACTS[cur-1].steps-1)}
$('#btnNext').addEventListener('click',next);$('#btnPrev').addEventListener('click',prev);
$('#btnFull').addEventListener('click',()=>{const d=document.documentElement;try{if(document.fullscreenElement)document.exitFullscreen();else d.requestFullscreen&&d.requestFullscreen()}catch(e){}});
document.addEventListener('keydown',e=>{const t=e.target.tagName;if(t==='SELECT'||t==='INPUT'||t==='TEXTAREA')return;if(e.key===' '||e.key==='ArrowLeft'||e.key==='PageDown'||e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();next()}else if(e.key==='ArrowRight'||e.key==='PageUp'||e.key==='ArrowUp'){e.preventDefault();prev()}else if(e.key==='f'||e.key==='F'){$('#btnFull').click()}else if(e.key==='Home'){go(0,0)}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>go(cur,step),250)});
let start=[0,0];try{const p=localStorage.getItem('cap-map-pos');if(p){const [a,b]=p.split(':').map(Number);if(a>=0&&a<ACTS.length)start=[a,Math.min(b,ACTS[a].steps-1)]}}catch(e){}
go(start[0],start[1]);

})();
</script>
</body></html>
