<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#2563eb"/>
  <g transform="translate(256,256)">
    <!-- Upward trend arrow -->
    <path d="M-120,80 L-40,0 L40,-80 L120,-40" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="120,-40 120,-100 60,-40" fill="white"/>
    <!-- Base line -->
    <line x1="-140" y1="120" x2="140" y2="120" stroke="rgba(255,255,255,0.4)" stroke-width="8" stroke-linecap="round"/>
    <!-- Dollar sign -->
    <text x="-145" y="-60" font-family="Arial,sans-serif" font-weight="bold" font-size="80" fill="rgba(255,255,255,0.3)">$</text>
  </g>
</svg>
